# Apache como proxy inverso hacia la aplicación Node.js (puerto 3000).
# Requiere: a2enmod proxy proxy_http
<VirtualHost *:80>
    ServerName helpdesk.local
    ServerAlias 100.107.121.57

    # La página de prueba de la Actividad 3 sigue disponible en /index.php
    ProxyPass /index.php !

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/helpdesk-error.log
    CustomLog ${APACHE_LOG_DIR}/helpdesk-access.log combined
</VirtualHost>
